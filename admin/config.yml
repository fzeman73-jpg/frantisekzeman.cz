backend:
  name: github
  repo: fzeman73-jpg/frantisekzeman.cz
  branch: main

site_url: https://frantisekzeman.cz
display_url: https://frantisekzeman.cz
logo_url: https://frantisekzeman.cz/assets/img/favicon.png

media_folder: assets/img/galerie
public_folder: assets/img/galerie

collections:
  - name: obsah
    label: Správa webu
    files:
      - name: koncerty
        label: "🎤 Koncerty"
        file: data/koncerty.json
        fields:
          - label: Koncerty
            name: koncerty
            widget: list
            label_singular: koncert
            summary: "{{fields.datum}} – {{fields.nazev}}"
            fields:
              - { label: "Datum", name: datum, widget: datetime, type: date, format: "YYYY-MM-DD", time_format: false, hint: "Den koncertu" }
              - { label: "Čas (např. 19:30)", name: cas, widget: string, required: false, default: "" }
              - { label: "Název akce", name: nazev, widget: string }
              - { label: "Místo", name: misto, widget: string, hint: "Např. Balbínova poetická hospůdka, Praha 2" }
              - { label: "Popis", name: popis, widget: text, required: false, default: "" }
              - { label: "Typ", name: typ, widget: select, options: ["Koncert", "Moderování & koncert", "Festival", "Jiné"], default: "Koncert" }
              - { label: "Odkaz (vstupenky / web akce)", name: odkaz, widget: string, required: false, default: "" }
              - { label: "Text odkazu (např. Vstupenky)", name: odkazText, widget: string, required: false, default: "" }
              - { label: "Druhý odkaz (volitelný)", name: odkaz2, widget: string, required: false, default: "" }
              - { label: "Text druhého odkazu", name: odkazText2, widget: string, required: false, default: "" }
      - name: instagram
        label: "📸 Instagram novinky"
        file: data/instagram.json
        fields:
          - label: Příspěvky
            name: prispevky
            widget: list
            label_singular: příspěvek
            summary: "{{fields.url}}"
            hint: "Nový příspěvek přidej úplně na začátek (první v seznamu = nahoře na webu). Zobrazuje se max 5 nejnovějších, starší se automaticky skryjí."
            fields:
              - { label: "Odkaz na příspěvek (URL)", name: url, widget: string, hint: "Např. https://www.instagram.com/p/XXXXXXXXXXX/" }
      - name: galerie
        label: "📷 Galerie fotek"
        file: data/galerie.json
        fields:
          - label: Fotky
            name: fotky
            widget: list
            label_singular: fotka
            summary: "{{fields.popisek}}"
            fields:
              - { label: "Fotka", name: obrazek, widget: image }
              - { label: "Popisek", name: popisek, widget: string, required: false, default: "" }
      - name: videa
        label: "🎬 Videa"
        file: data/videa.json
        fields:
          - label: Skupiny videí
            name: skupiny
            widget: list
            label_singular: skupina
            summary: "{{fields.nazev}}"
            hint: "Skupina = jeden blok na stránce Videa (např. Oficiální klipy nebo konkrétní koncert)."
            fields:
              - { label: "ID skupiny (do odkazu, bez diakritiky a mezer)", name: id, widget: string, hint: "Např. dracice-2026 – vznikne odkaz videa.html#dracice-2026" }
              - { label: "Název skupiny", name: nazev, widget: string }
              - { label: "Popis skupiny", name: popis, widget: text, required: false, default: "" }
              - { label: "Datum akce (volitelné)", name: datum, widget: datetime, type: date, format: "YYYY-MM-DD", time_format: false, required: false }
              - { label: "Formát videí", name: format, widget: select, options: [{ label: "Na šířku (klasické video)", value: "sirka" }, { label: "Na výšku (Shorts / mobil)", value: "vyska" }], default: "sirka" }
              - label: Videa
                name: videa
                widget: list
                label_singular: video
                summary: "{{fields.nazev}}"
                default: []
                fields:
                  - { label: "Název", name: nazev, widget: string }
                  - { label: "Odkaz na YouTube (nebo jen ID videa)", name: youtube, widget: string, hint: "Můžeš vložit celou adresu, i ze Shorts – ID se vytáhne samo." }
                  - { label: "Popisek pod videem", name: popis, widget: string, required: false, default: "" }
                  - { label: "Vlastní náhledový obrázek (volitelné)", name: nahled, widget: image, required: false, default: "" }
      - name: blog
        label: "📝 Blog"
        file: data/blog.json
        fields:
          - label: Články
            name: clanky
            widget: list
            label_singular: článek
            summary: "{{fields.datum}} – {{fields.nadpis}}"
            fields:
              - { label: "Datum", name: datum, widget: datetime, type: date, format: "YYYY-MM-DD", time_format: false }
              - { label: "Slug (do URL, bez diakritiky a mezer)", name: slug, widget: string, hint: "Např. bluestone-fest-2026" }
              - { label: "Nadpis", name: nadpis, widget: string }
              - { label: "Perex (krátký úvod pro výpis a SEO popisek)", name: perex, widget: text }
              - { label: "Titulní fotka", name: obrazek, widget: image }
              - { label: "Titulní fotka pro sdílení (1200×630, volitelné)", name: obrazekOg, widget: image, required: false, default: "" }
              - { label: "Štítky", name: stitky, widget: list, field: { label: "Štítek", name: stitek, widget: string }, required: false, default: [] }
              - { label: "Obsah článku (HTML/odstavce)", name: obsah, widget: text }
              - label: Fotogalerie k článku
                name: galerie
                widget: list
                label_singular: fotka
                required: false
                default: []
                fields:
                  - { label: "Fotka", name: obrazek, widget: image }
                  - { label: "Popisek", name: popisek, widget: string, required: false, default: "" }
